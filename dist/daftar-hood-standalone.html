<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>دفتر هود الذكي</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="دفتر هود الذكي — إدارة المهام والمشاريع والحياة اليومية بالعربية">
<meta name="theme-color" content="#F4F6F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="دفتر هود">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232E7D6B'/><text y='72' x='50' font-size='58' text-anchor='middle' fill='white'>📔</text></svg>">
<style>
/* ═══════════════════════════════════════════════════════════════
   دفتر هود الذكي — التنسيقات
   جوال أولًا • RTL • نهاري/ليلي • ألوان هادئة
   ═══════════════════════════════════════════════════════════════ */

:root {
  --bg:        #F4F6F5;
  --bg-elev:   #FFFFFF;
  --bg-sunken: #EBEFEE;
  --text:      #1B2430;
  --text-soft: #5A6675;
  --text-dim:  #8A94A3;
  --border:    #DDE3E6;
  --border-strong: #C3CCD2;

  --brand:     #2E7D6B;
  --brand-soft:#E4F0EC;

  --ok:        #2E7D32;
  --warn:      #C77700;
  --danger:    #C0392B;
  --danger-soft:#FBE9E7;

  --overdue:   #C0392B;
  --today:     #B5773A;
  --soon:      #5B6ABF;

  --radius:    14px;
  --radius-sm: 9px;
  --shadow:    0 1px 3px rgba(16,24,40,.06), 0 4px 14px rgba(16,24,40,.05);
  --shadow-lg: 0 8px 28px rgba(16,24,40,.14);

  --fs-base:   15.5px;
  --tap:       46px;
}

body.dark {
  --bg:        #12161C;
  --bg-elev:   #1A1F27;
  --bg-sunken: #0E1217;
  --text:      #E7ECF2;
  --text-soft: #A6B0BC;
  --text-dim:  #7A8492;
  --border:    #2A313B;
  --border-strong: #3A424E;

  --brand:     #4CAF98;
  --brand-soft:#16302B;

  --ok:        #5CBF60;
  --warn:      #E0A33A;
  --danger:    #E8695C;
  --danger-soft:#3A1F1C;

  --overdue:   #E8695C;
  --today:     #D89B5C;
  --soon:      #8A96DA;

  --shadow:    0 1px 3px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  --shadow-lg: 0 10px 34px rgba(0,0,0,.55);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Naskh Arabic', 'Segoe UI', 'Tahoma', 'Noto Sans Arabic', system-ui, -apple-system, sans-serif;
  font-size: var(--fs-base);
  line-height: 1.65;
  direction: rtl;
  text-align: right;
  overflow-x: hidden;
  padding-bottom: 78px;
  transition: background .22s ease, color .22s ease;
}

button, input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

input, select, textarea {
  background: var(--bg-elev);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 11px 13px;
  width: 100%;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
  min-height: 44px;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px var(--brand-soft);
}
textarea { resize: vertical; line-height: 1.6; }
select { cursor: pointer; }

/* ─── الترويسة ────────────────────────────────────────────── */
.app-header {
  position: sticky; top: 0; z-index: 40;
  background: linear-gradient(180deg, var(--bg) 82%, rgba(0,0,0,0));
  backdrop-filter: blur(14px);
  padding: 14px 16px 10px;
}

.header-top {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  margin-bottom: 13px;
}
.greet { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.greet-hello { font-size: 19px; font-weight: 700; letter-spacing: -.2px; }
.greet-date { font-size: 13px; color: var(--text-soft); }

.header-btns { display: flex; gap: 7px; flex-shrink: 0; }

.icon-btn {
  background: var(--bg-elev);
  border: 1.5px solid var(--border);
  border-radius: 11px;
  width: 42px; height: 42px;
  font-size: 17px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform .12s, border-color .15s, background .15s;
  flex-shrink: 0;
}
.icon-btn:active { transform: scale(.92); }
.icon-btn.sm { width: 38px; height: 38px; font-size: 15px; border-radius: 9px; }
.icon-btn.on { background: var(--brand); border-color: var(--brand); color: #fff; }

/* ─── بطاقات الملخص ───────────────────────────────────────── */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.sum-card {
  background: var(--bg-elev);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 11px 5px 9px;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  cursor: pointer;
  transition: transform .12s, border-color .15s;
  box-shadow: var(--shadow);
}
.sum-card:active { transform: scale(.95); }
.sum-num { font-size: 23px; font-weight: 800; line-height: 1.1; letter-spacing: -.5px; }
.sum-lbl { font-size: 11px; color: var(--text-soft); text-align: center; line-height: 1.25; }
.sum-overdue .sum-num { color: var(--overdue); }
.sum-today   .sum-num { color: var(--today); }
.sum-meet    .sum-num { color: var(--soon); }
.sum-done    .sum-num { color: var(--ok); }
.sum-overdue { border-color: color-mix(in srgb, var(--overdue) 35%, var(--border)); }

/* ─── شريط الوقت ──────────────────────────────────────────── */
.time-bar-wrap {
  margin-top: 11px;
  background: var(--bg-elev);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  box-shadow: var(--shadow);
}
.time-bar-head {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 13px; color: var(--text-soft); margin-bottom: 7px;
}
.time-bar {
  position: relative; height: 9px; border-radius: 5px;
  background: var(--bg-sunken); overflow: hidden;
}
.tb-seg { position: absolute; top: 0; bottom: 0; }
.time-legend {
  display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 7px;
  font-size: 11.5px; color: var(--text-soft);
}
.tl-item { display: inline-flex; align-items: center; gap: 5px; }
.tl-item i { width: 8px; height: 8px; border-radius: 3px; display: inline-block; }

.link-btn {
  background: none; border: none; color: var(--brand);
  font-size: 13px; font-weight: 600; cursor: pointer; padding: 3px 5px;
  text-decoration: underline; text-underline-offset: 3px;
}

/* ─── المحتوى ─────────────────────────────────────────────── */
.app-main { padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 16px; }

/* ─── شريط التذكيرات ──────────────────────────────────────── */
.reminder-banner {
  display: flex; align-items: center; gap: 9px;
  background: var(--brand-soft);
  border: 1.5px solid color-mix(in srgb, var(--brand) 25%, transparent);
  border-radius: var(--radius);
  padding: 10px 13px; font-size: 13.5px;
}
.reminder-banner.has-overdue {
  background: var(--danger-soft);
  border-color: color-mix(in srgb, var(--danger) 30%, transparent);
}
.rb-ico { font-size: 17px; }
.rb-text { flex: 1; font-weight: 600; }

/* ─── الإملاء ─────────────────────────────────────────────── */
.capture { position: relative; }
.capture-box {
  background: var(--bg-elev);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 11px;
  box-shadow: var(--shadow);
  transition: border-color .2s;
}
.capture-box:focus-within { border-color: var(--brand); }
.capture-box textarea {
  border: none; background: transparent; padding: 4px 2px;
  font-size: 16px; min-height: 62px;
}
.capture-box textarea:focus { box-shadow: none; border: none; }
.capture-box textarea::placeholder { color: var(--text-dim); }

.capture-row { display: flex; gap: 7px; align-items: center; margin-top: 9px; }
.capture-go { margin-inline-start: auto; }
.capture-note {
  font-size: 12.5px; color: var(--text-soft); margin-top: 8px;
  line-height: 1.5;
}
.capture-note:empty { display: none; }
.btn.rec { background: var(--danger); border-color: var(--danger); color: #fff; }

/* ─── الأزرار ─────────────────────────────────────────────── */
.btn {
  border: 1.5px solid transparent;
  border-radius: var(--radius-sm);
  padding: 11px 17px;
  font-weight: 600;
  cursor: pointer;
  min-height: var(--tap);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: transform .1s, background .15s, border-color .15s, opacity .15s;
  white-space: nowrap;
}
.btn:active { transform: scale(.96); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-sm { padding: 8px 13px; min-height: 38px; font-size: 13.5px; }

.btn-primary { background: var(--brand); color: #fff; }
.btn-primary:hover { filter: brightness(1.06); }
.btn-ghost { background: var(--bg-elev); border-color: var(--border); color: var(--text); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger-soft { background: var(--danger-soft); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 25%, transparent); }

/* ─── مراجعة قبل الحفظ ────────────────────────────────────── */
.review-wrap {
  background: var(--bg-elev);
  border: 2px solid var(--brand);
  border-radius: var(--radius);
  padding: 13px;
  box-shadow: var(--shadow-lg);
  animation: slideIn .25s ease;
}
@keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

.review-head h3 { margin: 0 0 3px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.review-head .count {
  background: var(--brand); color: #fff; border-radius: 20px;
  padding: 1px 9px; font-size: 12.5px; font-weight: 700;
}
.review-hint { margin: 0 0 11px; font-size: 12.5px; color: var(--text-soft); }
.review-list { display: flex; flex-direction: column; gap: 10px; }

.rv-card {
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 11px;
  background: var(--bg-sunken);
}
.rv-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.rv-title {
  font-weight: 700; font-size: 15px;
  background: transparent; border: none; border-bottom: 1.5px dashed var(--border-strong);
  border-radius: 0; padding: 4px 0; min-height: 0;
}
.rv-title:focus { box-shadow: none; border-color: var(--brand); border-radius: 0; }
.rv-del {
  background: var(--danger-soft); color: var(--danger); border: none;
  width: 34px; height: 34px; border-radius: 9px; font-size: 15px;
  cursor: pointer; flex-shrink: 0;
}
.rv-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 9px; }
.chip {
  font-size: 11.5px; padding: 2px 9px; border-radius: 20px;
  border: 1.5px solid var(--border); font-weight: 600;
}
.chip-sec { font-weight: 700; }
.chip-conf { background: var(--bg-elev); color: var(--text-soft); }
.chip-ai { background: var(--brand); color: #fff; border-color: var(--brand); }

.rv-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 7px;
}
.rv-f { display: flex; flex-direction: column; gap: 3px; }
.rv-f span { font-size: 11px; color: var(--text-soft); font-weight: 600; }
.rv-f select, .rv-f input { padding: 7px 9px; min-height: 38px; font-size: 13.5px; }

.rv-entities {
  display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px;
  font-size: 12px;
}
.ent {
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: 6px; padding: 2px 8px; color: var(--text-soft);
}
.rv-status { margin-top: 8px; font-size: 12.5px; font-weight: 700; }

.review-actions { display: flex; gap: 8px; margin-top: 13px; }
.review-actions .btn { flex: 1; }

/* ─── المؤقت النشط ────────────────────────────────────────── */
.active-timer {
  background: var(--bg-elev);
  border: 2px solid var(--brand);
  border-radius: var(--radius);
  padding: 12px 13px;
  box-shadow: var(--shadow);
  animation: pulseBorder 2.5s infinite;
}
@keyframes pulseBorder {
  0%,100% { box-shadow: var(--shadow); }
  50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--brand) 14%, transparent); }
}
.at-row { display: flex; align-items: center; gap: 10px; }
.at-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--danger); flex-shrink: 0;
  animation: blink 1.5s infinite;
}
.at-dot.paused { background: var(--warn); animation: none; }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .28; } }
.at-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.at-lbl { font-size: 11.5px; color: var(--text-soft); }
.at-title {
  font-weight: 700; font-size: 14.5px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.at-clock {
  font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums;
  letter-spacing: -.5px; color: var(--brand);
}
.at-actions { display: flex; gap: 7px; margin-top: 10px; flex-wrap: wrap; }

/* ─── الاجتماعات ──────────────────────────────────────────── */
.meetings-sec { display: flex; flex-direction: column; gap: 8px; }
.sec-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin-bottom: 2px;
}
.sec-head h3 { margin: 0; font-size: 16.5px; font-weight: 700; }
.sec-sub { font-size: 12.5px; color: var(--text-soft); }
.meet-group-lbl {
  font-size: 12px; font-weight: 700; color: var(--text-dim);
  margin: 5px 0 -2px; letter-spacing: .3px;
}

.meet-card {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--bg-elev);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 11px 12px;
  box-shadow: var(--shadow);
}
.meet-time {
  font-size: 12.5px; font-weight: 800; color: var(--brand);
  background: var(--brand-soft); border-radius: 8px;
  padding: 5px 8px; white-space: nowrap; flex-shrink: 0;
  min-width: 62px; text-align: center;
}
.meet-body { flex: 1; min-width: 0; }
.meet-title { font-weight: 700; font-size: 15px; margin-bottom: 3px; }
.meet-meta {
  display: flex; flex-wrap: wrap; gap: 4px 10px;
  font-size: 12px; color: var(--text-soft);
}
.mm-today { color: var(--today); font-weight: 800; }
.meet-cal { margin-top: 6px; }
.cal-badge {
  font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 600;
}
.cal-ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.cal-fail { background: var(--danger-soft); color: var(--danger); }
.cal-none { background: var(--bg-sunken); color: var(--text-dim); }
.meet-acts { display: flex; flex-direction: column; gap: 5px; }

/* ─── التبويبات ───────────────────────────────────────────── */
.tabs {
  display: flex; gap: 7px; overflow-x: auto; padding: 3px 1px 7px;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }

.tab {
  background: var(--bg-elev);
  border: 1.5px solid var(--border);
  border-radius: 22px;
  padding: 8px 14px;
  display: flex; align-items: center; gap: 6px;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
  transition: all .15s;
  font-weight: 600; font-size: 13.5px;
  min-height: 42px;
}
.tab:active { transform: scale(.96); }
.tab.active {
  background: var(--sec-color, var(--brand));
  border-color: var(--sec-color, var(--brand));
  color: #fff;
  box-shadow: 0 3px 10px color-mix(in srgb, var(--sec-color, var(--brand)) 32%, transparent);
}
.tab.active .tab-count { background: rgba(255,255,255,.25); color: #fff; }
.tab-icon { font-size: 14px; }
.tab-count {
  font-size: 11px; background: var(--bg-sunken); color: var(--text-soft);
  border-radius: 20px; padding: 0 7px; font-weight: 700; min-width: 20px; text-align: center;
}
.tab-manage { padding: 8px 12px; color: var(--text-soft); }

/* ─── المرشحات ────────────────────────────────────────────── */
.filters { display: flex; flex-direction: column; gap: 7px; margin-bottom: 11px; }
.flt-search input { border-radius: 22px; padding-inline-start: 15px; }
.flt-row { display: flex; gap: 6px; }
.flt-sel {
  flex: 1; font-size: 13px; padding: 8px 9px; min-height: 40px;
  border-radius: 10px;
}

/* ─── مجموعة المهام ───────────────────────────────────────── */
.tasks-wrap { display: flex; flex-direction: column; }
.tasks-sec { display: flex; flex-direction: column; gap: 13px; }
.task-group { display: flex; flex-direction: column; gap: 8px; }
.tg-head { display: flex; align-items: center; gap: 8px; padding: 0 2px; }
.tg-label { font-size: 13.5px; font-weight: 800; letter-spacing: -.2px; }
.tg-count {
  font-size: 11px; background: var(--bg-sunken); color: var(--text-soft);
  border-radius: 20px; padding: 1px 8px; font-weight: 700;
}
.g-overdue .tg-label { color: var(--overdue); }
.g-today   .tg-label { color: var(--today); }
.g-soon    .tg-label { color: var(--soon); }
.g-none    .tg-label { color: var(--text-dim); }
.g-done    .tg-label { color: var(--ok); }

/* ─── بطاقة مهمة ──────────────────────────────────────────── */
.task-card {
  background: var(--bg-elev);
  border: 1.5px solid var(--border);
  border-inline-start: 4px solid var(--sec-color, var(--border));
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: border-color .15s, transform .12s;
}
.task-card.is-overdue { border-inline-start-color: var(--overdue); }
.task-card.is-done { opacity: .6; }
.task-card.is-done .tc-title { text-decoration: line-through; color: var(--text-dim); }

.tc-main { display: flex; align-items: flex-start; gap: 9px; padding: 11px 12px; }

.tc-check {
  width: 27px; height: 27px; border-radius: 50%;
  border: 2px solid var(--border-strong);
  background: transparent; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 800; color: transparent;
  transition: all .15s; margin-top: 1px;
}
.tc-check:active { transform: scale(.86); }
.tc-check:hover { border-color: var(--ok); }
.task-card.is-done .tc-check {
  background: var(--ok); border-color: var(--ok); color: #fff;
}

.tc-body { flex: 1; min-width: 0; cursor: pointer; }
.tc-title-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tc-title { font-weight: 650; font-size: 15px; line-height: 1.45; }

.prio { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.prio-urgent { background: var(--danger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 20%, transparent); }
.prio-high   { background: var(--warn); }
.prio-low    { background: var(--text-dim); opacity: .55; }

.size-tag {
  font-size: 10.5px; font-weight: 700;
  background: var(--bg-sunken); color: var(--text-soft);
  border-radius: 5px; padding: 0 6px;
}

.tc-meta {
  display: flex; flex-wrap: wrap; gap: 3px 10px;
  font-size: 12px; color: var(--text-soft); margin-top: 4px;
}
.tc-sec { font-weight: 600; }
.tc-due { font-weight: 700; }
.due-overdue { color: var(--overdue); }
.due-today   { color: var(--today); }
.due-tomorrow{ color: var(--soon); }
.due-soon    { color: var(--soon); }
.due-later   { color: var(--text-soft); }
.due-none    { color: var(--text-dim); font-weight: 400; }
.due-done    { color: var(--ok); }
.tc-rep, .tc-spent { color: var(--text-dim); }

.tc-acts { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
.assist-btn { background: var(--brand-soft); border-color: transparent; color: var(--brand); }

/* ─── تفاصيل المهمة ───────────────────────────────────────── */
.tc-detail {
  border-top: 1.5px solid var(--border);
  padding: 11px 12px 12px;
  background: var(--bg-sunken);
  animation: slideIn .2s ease;
}
.dt-rows { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
.dt-row {
  display: flex; gap: 10px; font-size: 13px;
  justify-content: space-between; align-items: baseline;
}
.dt-row span { color: var(--text-soft); flex-shrink: 0; font-size: 12.5px; }
.dt-row b { font-weight: 600; text-align: left; word-break: break-word; }

/* ─── حالات فارغة ─────────────────────────────────────────── */
.empty { color: var(--text-dim); font-size: 13.5px; text-align: center; padding: 14px 8px; margin: 0; }

/* ─── الشريط السفلي ───────────────────────────────────────── */
.bottom-bar {

.tm-active {

.tl-sec-row { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; font-size: 13px; }

.tl-sec-bar { flex: 1; height: 8px; background: var(--bg-sunken); border-radius: 4px; overflow: hidden; }

.tl-row {

}

.tl-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-dur { font-weight: 700; color: var(--brand); font-size: 12.5px; flex-shrink: 0; }

/* ─── إدارة الأقسام ───────────────────────────────────────── */
.mgr-list { display: flex; flex-direction: column; gap: 10px; }
.mgr-sec { border: 1.5px solid var(--border); border-radius: var(--radius); padding: 11px; }
.mgr-sec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
.mgr-dot { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; }
.mgr-name { flex: 1; font-weight: 700; font-size: 14px; }
.mgr-cats { display: flex; flex-wrap: wrap; gap: 5px; }
.mgr-cat {

  padding: 4px 6px 4px 10px; font-size: 12px;
}

  background: none; border: none; color: var(--text-dim);
  cursor: pointer; font-size: 12px; padding: 0 3px;
}
.mgr-cat-add {
  background: none; border: 1.5px dashed var(--border-strong);
  border-radius: 20px; padding: 4px 11px; font-size: 12px;
  color: var(--text-soft); cursor: pointer;
}

/* ─── التنبيه العائم ──────────────────────────────────────── */
.toast {
  position: fixed; z-index: 90;
  bottom: calc(76px + env(safe-area-inset-bottom));
  inset-inline: 16px;
  background: var(--text);
  color: var(--bg);
  border-radius: var(--radius);
  padding: 13px 15px;
  display: flex; align-items: center; gap: 11px;
  font-size: 14px; font-weight: 600;
  box-shadow: var(--shadow-lg);

  transition: opacity .22s, transform .22s;
}

.toast-msg { flex: 1; line-height: 1.5; }
.toast-action {
  background: rgba(255,255,255,.18); color: inherit;
  border: none; border-radius: 8px; padding: 8px 13px;
  font-weight: 700; cursor: pointer; font-size: 13.5px; flex-shrink: 0;
}
.toast-ok { background: var(--ok); color: #fff; }
.toast-warn { background: var(--warn); color: #fff; }

/* ─── شاشات كبيرة ─────────────────────────────────────────── */
@media (min-width: 720px) {
  .app-main, .app-header { max-width: 700px; margin-inline: auto; }

/* ─── تقليل الحركة ────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;

/* ─── طباعة ───────────────────────────────────────────────── */
@media print {
  .bottom-bar, .header-btns, .capture, .tabs, .filters, .toast, .tc-acts { display: none !important; }
  body { padding-bottom: 0; background: #fff; }

}

<script>
/* ==== js/store.js ==== */
/* ═══════════════════════════════════════════════════════════════
   دفتر هود الذكي — طبقة البيانات (store.js)
   تخزين محلي بالكامل عبر localStorage + طبقة مزامنة اختيارية.
   لا تُرسل أي بيانات لأي جهة إلا إذا ربط المستخدم خدمة سحابية.
   ═══════════════════════════════════════════════════════════════ */
(function (global) {
  'use strict';

  const SCHEMA_VERSION = 1;
  const K = {
    meta:    'dh_meta',
    sections:'dh_sections',
    tasks:   'dh_tasks',
    cats:    'dh_categories',
    meetings:'dh_meetings',
    time:    'dh_timelog',
    timer:   'dh_active_timer',
    settings:'dh_settings',
    done:    'dh_done_log'
  };

  /* ── أدوات مساعدة ─────────────────────────────────────────── */
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  // التاريخ بصيغة YYYY-MM-DD بالتوقيت المحلي للجهاز (وليس UTC)
  function todayISO(d) {
    d = d || new Date();
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function addDaysISO(base, n) {
    const d = base ? new Date(base + 'T12:00:00') : new Date();
    d.setDate(d.getDate() + n);
    return todayISO(d);
  }

  // فرق الأيام بين تاريخين (b - a)
  function daysBetween(aISO, bISO) {
    const a = new Date(aISO + 'T12:00:00');
    const b = new Date(bISO + 'T12:00:00');
    return Math.round((b - a) / 86400000);
  }

  function safeJSON(raw, fallback) {
    if (raw === null || raw === undefined) return fallback;
    try {
      const v = JSON.parse(raw);
      return (v === null || v === undefined) ? fallback : v;
    } catch (e) {
      console.warn('[store] بيانات تالفة، تم استخدام القيمة الافتراضية:', e.message);
      return fallback;
    }
  }

  function read(key, fallback) {
    try { return safeJSON(localStorage.getItem(key), fallback); }
    catch (e) { return fallback; }
  }

  function write(key, val) {
    try {
      localStorage.setItem(key, JSON.stringify(val));
      return true;
    } catch (e) {
      // الحصة ممتلئة أو التخزين معطّل (وضع التصفح الخاص)
      console.error('[store] فشل الحفظ:', e.message);
      if (global.DH && DH.ui && DH.ui.toast) {
        DH.ui.toast('تعذّر الحفظ: مساحة التخزين ممتلئة أو معطّلة', 'error');
      }
      return false;
    }
  }

  /* ── الأقسام الافتراضية ───────────────────────────────────── */
  function defaultSections() {
    return [
      { id: 'sec_work',  name: 'عملي – محلات أبو ياسين التجارية', short: 'عملي',
        color: '#2E7D6B', icon: '🏪', order: 0, system: true, cats: ['cat_acct','cat_collect','cat_sales','cat_reps','cat_stock','cat_prices','cat_staff','cat_reports'] },
      { id: 'sec_tech',  name: 'مشاريعي التقنية', short: 'مشاريعي',
        color: '#5B6ABF', icon: '⚙️', order: 1, system: true, cats: ['cat_android','cat_github','cat_code','cat_ai','cat_test','cat_bug','cat_deploy'] },
      { id: 'sec_personal', name: 'شخصي', short: 'شخصي',
        color: '#B5773A', icon: '🏠', order: 2, system: true, cats: ['cat_appt','cat_duties','cat_shopping','cat_family','cat_goals'] }
    ];
  }

  function defaultCategories() {
    return [
      // عملي

      { id: 'cat_collect',  sectionId: 'sec_work', name: 'تحصيل المستحقات ومتابعة العملاء', icon: '💰' },

  function defaultSettings() {
    return {
      theme: 'auto',                 // auto | light | dark
      workDays: [0,1,2,3,4],          // الأحد–الخميس (0=الأحد)
      workTime: '08:30',
      offTime: '12:00',
      remindersEnabled: false,
      reminderOverdue: true,
      reminderToday: true,
      reminderMeetings: true,
      meetingLeadMinutes: 15,
      lastReminderShown: null,
      aiEndpoint: '',                // فارغ = التحليل المحلي
      aiModel: '',
      syncEndpoint: '',
      userName: 'هود'
    };
  }

  /* ── الحالة ───────────────────────────────────────────────── */
  const state = {
    sections: [],
    tasks: [],
    categories: [],
    meetings: [],
    timeLog: [],       // { id, taskId, startedAt, endedAt, seconds, day }
    doneLog: [],       // سجل الإنجاز
    settings: {},
    activeTimer: null, // { taskId, startedAt, accumulated, paused, pausedAt }
    migrated: false
  };

  /* ── الإقلاع ──────────────────────────────────────────────── */
  function load() {
    const meta = read(K.meta, null);

    // نقرأ كل البيانات أولًا، قبل أي كتابة — حتى لا نمحو شيئًا محفوظًا
    const storedTasks    = read(K.tasks, []);
    const storedTimer    = read(K.timer, null);
    const storedTime     = read(K.time, []);
    const storedDone     = read(K.done, []);
    const storedMeetings = read(K.meetings, []);

    const isFirstRun = !meta &&
      storedTasks.length === 0 && !storedTimer &&
      storedTime.length === 0 && storedMeetings.length === 0;

    if (isFirstRun) {
      // أول تشغيل حقيقي: نُنشئ الافتراضيات
      state.sections = defaultSections();
      state.categories = defaultCategories();
      state.settings = defaultSettings();
      state.migrated = true;
    } else {
      state.sections   = read(K.sections,  defaultSections());
      state.categories = read(K.cats,      defaultCategories());
      state.settings   = Object.assign(defaultSettings(), read(K.settings, {}));
      if (state.sections.length === 0) state.sections = defaultSections();
      if (state.categories.length === 0) state.categories = defaultCategories();
    }

    // استرجاع البيانات المحفوظة (يجب أن يسبق أي persistAll)
    state.tasks       = storedTasks;
    state.meetings    = storedMeetings;
    state.timeLog     = storedTime;
    state.doneLog     = storedDone;
    state.activeTimer = storedTimer;

    // إصلاح المراجع المكسورة
    reconcile();

    // الآن يمكن الكتابة بأمان
    if (isFirstRun) {
      persistAll();
      write(K.meta, { schema: SCHEMA_VERSION, created: new Date().toISOString() });
    } else if (!meta || meta.schema !== SCHEMA_VERSION) {
      persistAll();
      write(K.meta, {
        schema: SCHEMA_VERSION,
        created: (meta && meta.created) || new Date().toISOString(),
        migratedAt: new Date().toISOString()
      });
    }

    return state;
  }

  // إصلاح مراجع مكسورة (قسم/تصنيف محذوف)
  function reconcile() {
    const secIds = new Set(state.sections.map(s => s.id));
    const catIds = new Set(state.categories.map(c => c.id));
    let dirty = false;
    const fallbackSec = state.sections.length ? state.sections[0].id : null;

    state.tasks.forEach(t => {
      if (!secIds.has(t.sectionId) && fallbackSec) { t.sectionId = fallbackSec; dirty = true; }
      if (t.categoryId && !catIds.has(t.categoryId)) { t.categoryId = null; dirty = true; }
    });
    // مهمة المؤقت النشط يجب أن تكون موجودة
    if (state.activeTimer && !state.tasks.some(t => t.id === state.activeTimer.taskId)) {
      state.activeTimer = null;
      write(K.timer, null);
    }
    if (dirty) write(K.tasks, state.tasks);
  }

  function persistAll() {
    write(K.sections, state.sections);
    write(K.categories, state.categories);
    write(K.settings, state.settings);
    write(K.tasks, state.tasks);
    write(K.meetings, state.meetings);
    write(K.time, state.timeLog);
  }

  /* ── المهام ───────────────────────────────────────────────── */
  function newTask(partial) {
    const now = new Date().toISOString();
    return Object.assign({
      id: uid(),
      title: '',
      notes: '',
      sectionId: 'sec_work',
      categoryId: null,
      priority: 'normal',          // low | normal | high | urgent
      size: 'small',               // small | large
      kind: 'task',                // task | meeting | reminder | ai_assist
      dueDate: null,
      suitableDays: [],            // أيام مناسبة للتنفيذ (ISO)
      repeat: 'none',              // none | daily | weekly | monthly
      status: 'open',              // open | in_progress | waiting_test | waiting_deploy | done
      client: '', rep: '', branch: '', item: '',
      amount: null, quantity: null, duePayment: null,
      repo: '', problem: '', changes: '', tests: '',
      buildStatus: '', nextStep: '',
      createdAt: now,
      updatedAt: now,
      completedAt: null,
      canceled: false,
      meetingId: null,
      aiAssist: null               // { type, draft, createdAt }
    }, partial || {});
  }

  function addTask(partial) {
    const t = newTask(partial);
    if (!t.title && t.problem) t.title = t.problem.slice(0, 60);
    state.tasks.push(t);
    write(K.tasks, state.tasks);
    emit('tasks');
    return t;
  }

  function updateTask(id, patch) {
    const t = state.tasks.find(x => x.id === id);
    if (!t) return null;
    Object.assign(t, patch, { updatedAt: new Date().toISOString() });
    write(K.tasks, state.tasks);
    emit('tasks');
    return t;
  }

  function getTask(id) { return state.tasks.find(x => x.id === id) || null; }

  // حذف مع إمكانية التراجع (نتيجة الحذف تُعاد للواجهة)
  function deleteTask(id) {
    const idx = state.tasks.findIndex(x => x.id === id);
    if (idx < 0) return null;
    const removed = state.tasks[idx];
    state.tasks.splice(idx, 1);
    // إيقاف المؤقت إن كان يعمل على هذه المهمة
    if (state.activeTimer && state.activeTimer.taskId === id) {
      stopTimer();
    }
    write(K.tasks, state.tasks);
    emit('tasks');
    return { task: removed, index: idx };
  }

  function restoreTask(snapshot) {
    if (!snapshot || !snapshot.task) return null;
    // منع التكرار إن أُعيدت سابقًا
    if (state.tasks.some(t => t.id === snapshot.task.id)) return snapshot.task;
    state.tasks.splice(Math.min(snapshot.index, state.tasks.length), 0, snapshot.task);
    write(K.tasks, state.tasks);
    emit('tasks');
    return snapshot.task;
  }

  function completeTask(id) {
    const t = getTask(id);
    if (!t) return null;
    t.status = 'done';
    t.completedAt = new Date().toISOString();
    t.updatedAt = t.completedAt;
    state.doneLog.push({ id: uid(), taskId: t.id, title: t.title, sectionId: t.sectionId,
                         completedAt: t.completedAt, spentSeconds: totalForTask(t.id) });
    if (state.doneLog.length > 2000) state.doneLog = state.doneLog.slice(-2000);
    write(K.tasks, state.tasks);
    write(K.done, state.doneLog);

    // المهام المتكررة: عند الإنجاز نُنشئ نسخة قادمة
    if (t.repeat && t.repeat !== 'none') {
      const base = t.dueDate || todayISO();
      const next = t.repeat === 'daily' ? addDaysISO(base, 1)
                 : t.repeat === 'weekly' ? addDaysISO(base, 7)
                 : addDaysISO(base, 30);
      addTask(Object.assign({}, t, {
        id: uid(), status: 'open', completedAt: null, dueDate: next,
        createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
        aiAssist: null,
        title: t.title + ' (متكررة)'
      }));
    }
    emit('tasks');
    return t;
  }

  function reopenTask(id) {
    const t = getTask(id);
    if (!t) return null;
    t.status = 'open';
    t.completedAt = null;
    t.updatedAt = new Date().toISOString();
    write(K.tasks, state.tasks);
    emit('tasks');
    return t;
  }

  /* ── الأقسام والتصنيفات ───────────────────────────────────── */
  function addSection(data) {
    const s = {
      id: uid(), name: data.name || 'قسم جديد', short: data.short || data.name || 'قسم',
      color: data.color || '#6B7280', icon: data.icon || '📁',
      order: state.sections.length, system: false, cats: []
    };
    state.sections.push(s);
    write(K.sections, state.sections);
    emit('sections');
    return s;
  }

  function updateSection(id, patch) {
    const s = state.sections.find(x => x.id === id);
    if (!s) return null;
    Object.assign(s, patch);
    write(K.sections, state.sections);
    emit('sections');
    return s;
  }

  function deleteSection(id) {
    const idx = state.sections.findIndex(x => x.id === id);
    if (idx < 0) return null;
    if (state.sections.length <= 1) return { error: 'لا يمكن حذف القسم الأخير' };
    const moved = state.tasks.filter(t => t.sectionId === id).length;
    if (moved > 0) return { error: 'يوجد ' + moved + ' مهمة في هذا القسم. انقلها أولًا.' };
    const removed = state.sections[idx];
    state.sections.splice(idx, 1);
    state.categories = state.categories.filter(c => c.sectionId !== id);
    write(K.sections, state.sections);
    write(K.cats, state.categories);
    emit('sections');
    return { section: removed };
  }

  function addCategory(data) {
    const c = { id: uid(), sectionId: data.sectionId, name: data.name || 'تصنيف جديد', icon: data.icon || '•' };
    state.categories.push(c);
    write(K.cats, state.categories);
    emit('sections');
    return c;
  }

  function updateCategory(id, patch) {
    const c = state.categories.find(x => x.id === id);
    if (!c) return null;
    Object.assign(c, patch);
    write(K.cats, state.categories);
    emit('sections');
    return c;
  }

  function deleteCategory(id) {
    const c = state.categories.find(x => x.id === id);
    if (!c) return null;
    state.categories = state.categories.filter(x => x.id !== id);
    state.tasks.forEach(t => { if (t.categoryId === id) t.categoryId = null; });
    write(K.cats, state.categories);
    write(K.tasks, state.tasks);
    emit('sections');
    return { category: c };
  }

  function catsFor(sectionId) {
    return state.categories.filter(c => c.sectionId === sectionId);
  }
  function sectionById(id) { return state.sections.find(s => s.id === id) || null; }
  function catById(id) { return state.categories.find(c => c.id === id) || null; }

  /* ── الاجتماعات ───────────────────────────────────────────── */
  function newMeeting(p) {
    return Object.assign({
      id: uid(), title: '', date: '', time: '', duration: 60,
      place: '', people: '', notes: '',
      sectionId: 'sec_work',
      calendarEventId: null,        // معرّف حدث Google Calendar إن رُبط
      calendarStatus: 'none',       // none | pending | synced | failed
      createdAt: new Date().toISOString()
    }, p || {});
  }

  function addMeeting(p) {
    const m = newMeeting(p);
    if (!m.date) return { error: 'التاريخ مطلوب لإنشاء الاجتماع' };
    state.meetings.push(m);
    // مهمة مرتبطة تظهر في قسم اجتماعات اليوم
    const t = addTask({
      title: m.title || 'اجتماع',
      sectionId: m.sectionId, categoryId: null,
      kind: 'meeting', dueDate: m.date, size: 'large',
      notes: (m.time ? 'الساعة ' + m.time + ' • ' : '') +
             (m.place ? 'المكان: ' + m.place + ' • ' : '') +
             (m.people ? 'الحاضرون: ' + m.people : ''),
      meetingId: m.id
    });
    m.taskId = t.id;
    write(K.meetings, state.meetings);
    write(K.tasks, state.tasks);
    emit('meetings'); emit('tasks');
    return m;
  }

  function updateMeeting(id, patch) {
    const m = state.meetings.find(x => x.id === id);
    if (!m) return null;
    Object.assign(m, patch);
    write(K.meetings, state.meetings);
    // تزامن المهمة المرتبطة
    if (m.taskId) {
      const t = getTask(m.taskId);
      if (t) {
        t.title = m.title || t.title;
        t.dueDate = m.date || t.dueDate;
        t.notes = (m.time ? 'الساعة ' + m.time + ' • ' : '') +
                  (m.place ? 'المكان: ' + m.place + ' • ' : '') +
                  (m.people ? 'الحاضرون: ' + m.people : '');
        write(K.tasks, state.tasks);
      }
    }
    emit('meetings'); emit('tasks');
    return m;
  }

  function deleteMeeting(id) {
    const idx = state.meetings.findIndex(x => x.id === id);
    if (idx < 0) return null;
    const removed = state.meetings[idx];
    state.meetings.splice(idx, 1);
    if (removed.taskId) {
      const i = state.tasks.findIndex(t => t.id === removed.taskId);
      if (i >= 0) state.tasks.splice(i, 1);
    }
    write(K.meetings, state.meetings);
    write(K.tasks, state.tasks);
    emit('meetings'); emit('tasks');
    return { meeting: removed, index: idx };
  }

  function meetingsOn(dateISO) {
    return state.meetings.filter(m => m.date === dateISO)
      .sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));
  }
  function upcomingMeetings(limit) {
    const today = todayISO();
    return state.meetings
      .filter(m => m.date >= today)
      .sort((a, b) => (a.date + (a.time || '99:99')).localeCompare(b.date + (b.time || '99:99')))
      .slice(0, limit || 5);
  }

  /* ── مؤقت العمل ───────────────────────────────────────────── */
  function startTimer(taskId) {
    if (state.activeTimer) {
      // مهمة واحدة فقط بالمؤقت في نفس الوقت
      return { error: 'يوجد مؤقت يعمل بالفعل على مهمة أخرى. أوقفه أولًا.',
               activeTaskId: state.activeTimer.taskId };
    }
    const t = getTask(taskId);
    if (!t) return { error: 'المهمة غير موجودة' };
    state.activeTimer = {
      taskId, startedAt: Date.now(), accumulated: 0, paused: false, pausedAt: null
    };
    if (t.status === 'open') t.status = 'in_progress';
    write(K.timer, state.activeTimer);
    write(K.tasks, state.tasks);
    emit('timer'); emit('tasks');
    return state.activeTimer;
  }

  function elapsedOf(timer) {
    if (!timer) return 0;
    const running = timer.paused ? 0 : (Date.now() - timer.startedAt) / 1000;
    const val = Math.floor(timer.accumulated + running);
    return val > 0 ? val : 0;
  }

  function pauseTimer() {
    if (!state.activeTimer || state.activeTimer.paused) return state.activeTimer;
    const t = state.activeTimer;
    t.accumulated = elapsedOf(t);
    t.paused = true;
    t.pausedAt = Date.now();
    write(K.timer, state.activeTimer);
    emit('timer');
    return t;
  }

  function resumeTimer() {
    if (!state.activeTimer || !state.activeTimer.paused) return state.activeTimer;
    const t = state.activeTimer;
    t.paused = false;
    t.startedAt = Date.now();
    t.pausedAt = null;
    write(K.timer, state.activeTimer);
    emit('timer');
    return t;
  }

  function stopTimer() {
    if (!state.activeTimer) return null;
    const t = state.activeTimer;
    const secs = elapsedOf(t);
    if (secs >= 1) {
      state.timeLog.push({
        id: uid(), taskId: t.taskId, seconds: secs,
        day: todayISO(), startedAt: new Date(t.startedAt).toISOString(),
        endedAt: new Date().toISOString()
      });
      if (state.timeLog.length > 5000) state.timeLog = state.timeLog.slice(-5000);
      write(K.time, state.timeLog);
    }
    state.activeTimer = null;
    write(K.timer, null);
    emit('timer'); emit('time');
    return { taskId: t.taskId, seconds: secs };
  }

  function totalForTask(taskId) {
    return state.timeLog.filter(e => e.taskId === taskId)
      .reduce((s, e) => s + e.seconds, 0);
  }

  function totalForDay(day) {
    day = day || todayISO();
    const bySection = {};
    let total = 0;
    state.timeLog.filter(e => e.day === day).forEach(e => {
      const t = getTask(e.taskId);
      const sid = t ? t.sectionId : 'unknown';
      bySection[sid] = (bySection[sid] || 0) + e.seconds;
      total += e.seconds;
    });
    return { total, bySection };
  }

  function logForTask(taskId) {
    return state.timeLog.filter(e => e.taskId === taskId)
      .sort((a, b) => b.startedAt.localeCompare(a.startedAt));
  }

  function logForDay(day) {
    return state.timeLog.filter(e => e.day === day)
      .sort((a, b) => b.startedAt.localeCompare(a.startedAt));
  }

  /* ── الإعدادات ────────────────────────────────────────────── */
  function setSetting(key, val) {
    state.settings[key] = val;
    write(K.settings, state.settings);
    emit('settings');
    return state.settings;
  }

  /* ── التصدير والاستيراد ───────────────────────────────────── */
  function exportAll() {
    return {
      app: 'daftar-hood', schema: SCHEMA_VERSION,
      exportedAt: new Date().toISOString(),
      sections: state.sections, categories: state.categories,
      tasks: state.tasks, meetings: state.meetings,
      timeLog: state.timeLog, doneLog: state.doneLog,
      settings: state.settings
    };
  }

  function importAll(data, mode) {
    if (!data || typeof data !== 'object') return { error: 'ملف غير صالح' };
    if (data.app !== 'daftar-hood') return { error: 'هذا الملف ليس نسخة احتياطية من دفتر هود' };
    if (!Array.isArray(data.tasks)) return { error: 'الملف لا يحتوي على مهام صالحة' };

    if (mode === 'replace') {
      state.sections  = data.sections  || defaultSections();
      state.categories= data.categories|| defaultCategories();
      state.tasks     = data.tasks;
      state.meetings  = data.meetings  || [];
      state.timeLog   = data.timeLog   || [];
      state.doneLog   = data.doneLog   || [];
      state.settings  = Object.assign(defaultSettings(), data.settings || {});
    } else {
      // دمج: نتجاهل المكرر بالمعرّف
      const ids = new Set(state.tasks.map(t => t.id));
      let added = 0;
      (data.tasks || []).forEach(t => { if (t && t.id && !ids.has(t.id)) { state.tasks.push(t); added++; } });
      const mids = new Set(state.meetings.map(m => m.id));
      (data.meetings || []).forEach(m => { if (m && m.id && !mids.has(m.id)) state.meetings.push(m); });
      const tids = new Set(state.timeLog.map(e => e.id));
      (data.timeLog || []).forEach(e => { if (e && e.id && !tids.has(e.id)) state.timeLog.push(e); });
      // الأقسام المخصصة
      const sids = new Set(state.sections.map(s => s.id));
      (data.sections || []).forEach(s => { if (s && s.id && !sids.has(s.id)) state.sections.push(s); });
      (data.categories || []).forEach(c => { if (c && c.id && !state.categories.some(x => x.id === c.id)) state.categories.push(c); });
      reconcile();
      persistAll();
      emit('tasks'); emit('sections'); emit('time');
      return { ok: true, added };
    }
    reconcile();
    persistAll();
    emit('tasks'); emit('sections'); emit('time'); emit('meetings');
    return { ok: true, mode: mode || 'merge', total: state.tasks.length };
  }

  function clearAll() {
    Object.values(K).forEach(k => {
      try { localStorage.removeItem(k); } catch (e) {}
    });
    state.tasks = []; state.meetings = []; state.timeLog = [];
    state.doneLog = []; state.activeTimer = null;
    state.sections = defaultSections();
    state.categories = defaultCategories();
    state.settings = defaultSettings();
    persistAll();
    emit('tasks'); emit('sections'); emit('time'); emit('meetings'); emit('settings');
    return { ok: true };
  }

  /* ── نظام الأحداث ─────────────────────────────────────────── */
  const listeners = {};
  function on(evt, fn) {
    (listeners[evt] = listeners[evt] || []).push(fn);
  }
  function emit(evt) {

      if (first.length < 3) return false;
      // أفعال المتكلم/المخاطب تبدأ غالبًا بـ أ/ن/ي/ت
      const stripped = first.replace(/^[أنيت]/, '');
      if (VERB_ROOTS.test(first)) return true;
      if (VERB_ROOTS.test(stripped)) return true;
      // كلمة أولى قصيرة جدًا مع بقية مقطع من كلمتين ⇒ غالبًا اسم معطوف
      return false;
    }

    function hasOwnVerb(seg) {
      const w = seg.split(/\s+/);
      return w.length >= 2 && w.some((x, i) => i > 0 && VERB_ROOTS.test(x));
    }

    const out = [];
    for (let i = 0; i < parts.length; i++) {
      const cur = parts[i].trim();
      if (!cur) continue;
      const words = cur.split(/\s+/).filter(Boolean);

      // مقطع لا يبدأ بفعل ولا يحوي فعلًا مستقلًا = اسم معطوف أو تكملة
      const isNounFragment = !startsWithVerb(cur) && !hasOwnVerb(cur);

      // عدد الكلمات الجوهرية (بدون حروف الجر والتعبيرات الزمنية)
      const STOP = /^(?:من|في|على|عن|إلى|الى|مع|عند|لدى|خلال|قبل|بعد|بـ|ب|لـ|ل|هذا|هذه|ذلك|بكرة|بكره|غدا|اليوم|امس|أمس|البارحة|كل|و)$/;
      const coreWords = words.filter(w => !STOP.test(w));

      // مؤشرات أن المقطع السابق لم يكتمل
      const prevEndsOpen = out.length > 0 &&
        /(?:^|\s)(?:من|في|على|عن|إلى|الى|مع|بـ|ب|لـ|ل|عند|لدى|خلال|قبل|بعد)\s*$/.test(out[out.length - 1]);

      // اسم معطوف بلا فعل: يُدمج إن كانت كلماته الجوهرية قليلة
      if (isNounFragment && out.length > 0 && (coreWords.length <= 3 || prevEndsOpen)) {
        const prev = out[out.length - 1];
        if (prev.length + cur.length < 115) {
          out[out.length - 1] = prev + ' و' + cur;
          continue;
        }
      }
      out.push(cur);
    }
    return out;
  }

  /* ── استخراج التاريخ ─────────────────────────────────────── */
  function parseDate(text, nowISO) {
    const base = nowISO || S().todayISO();
    const baseDate = new Date(base + 'T12:00:00');
    const ntext = normalize(text);

    // 1) تاريخ صريح رقمية: 2026-05-12 أو 12/5/2026
    let m = ntext.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
    if (m) {
      const y = +m[1], mo = +m[2], d = +m[3];
      if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31) {
        return { date: y + '-' + String(mo).padStart(2,'0') + '-' + String(d).padStart(2,'0'), source: 'صريح' };
      }
    }
    // 12/5/2026 (يوم/شهر/سنة)
    m = ntext.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
    if (m) {
      const d = +m[1], mo = +m[2], y = +m[3];
      if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31) {
        return { date: y + '-' + String(mo).padStart(2,'0') + '-' + String(d).padStart(2,'0'), source: 'صريح' };
      }
    }
    // 12/5 (يوم/شهر، السنة الحالية أو القادمة)
    m = ntext.match(/(?:^|\s)(\d{1,2})[\/\-](\d{1,2})(?=\s|$)/);
    if (m) {
      const d = +m[1], mo = +m[2];
      if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31) {
        let y = baseDate.getFullYear();
        let cand = new Date(y, mo - 1, d, 12);
        if ((cand - baseDate) / 86400000 < -180) { y++; cand = new Date(y, mo - 1, d, 12); }
        return { date: cand.getFullYear() + '-' + String(cand.getMonth()+1).padStart(2,'0') +
                 '-' + String(cand.getDate()).padStart(2,'0'), source: 'صريح' };
      }
    }

    // 2) "بعد N أيام / أسابيع / أشهر"
    m = ntext.match(/بعد\s+(\d+)\s*(يوم|ايام|أيام|اسبوع|أسابيع|اسابيع|شهر|اشهر|أشهر)/);
    if (m) {
      const n = +m[1];
      const unit = m[2];
      const mult = /يوم|ايام/.test(unit) ? 1 : /اسبوع|أسابيع|اسابيع/.test(unit) ? 7 : 30;
      return { date: S().addDaysISO(base, n * mult), source: 'نسبي' };
    }

    // 2ب) «بعد N يوم» بصيغة أخرى، و«خلال N يوم»
    m = ntext.match(/(?:خلال|في غضون)\s+(\d+)\s*(يوم|ايام|أيام|اسبوع|اسابيع|شهر|اشهر)/);
    if (m) {
      const n = +m[1];
      const unit = m[2];
      const mult = /يوم|ايام/.test(unit) ? 1 : /اسبوع|اسابيع/.test(unit) ? 7 : 30;
      return { date: S().addDaysISO(base, n * mult), source: 'نسبي' };
    }

    // 3) كلمات التوقيت النسبي
    for (const r of TIME_RULES) {
      if (hasAny(text, r.w)) {
        if (r.d !== undefined) return { date: S().addDaysISO(base, r.d), source: 'نسبي' };
        if (r.special === 'end_of_month') {
          const last = new Date(baseDate.getFullYear(), baseDate.getMonth() + 1, 0, 12);
          return { date: S().todayISO(last), source: 'نسبي' };
        }
        if (r.special === 'start_of_month') {
          const d = new Date(baseDate.getFullYear(), baseDate.getMonth() + 1, 1, 12);
          return { date: S().todayISO(d), source: 'نسبي' };
        }
        if (r.special === 'end_of_week') {
          // أقرب خميس/جمعة
          const dow = baseDate.getDay();
          const delta = (5 - dow + 7) % 7 || 7;
          return { date: S().addDaysISO(base, delta), source: 'نسبي' };
        }
      }
    }

    // 4) اسم يوم الأسبوع ("الاثنين" = الأقرب القادم)
    for (const name in WEEKDAYS) {
      const nn = normalize(name).replace(/^يوم\s+/, '');
      const re = new RegExp('(^|[\\s،])' + nn + '(?![\\u0621-\\u064A])', 'u');
      if (re.test(ntext)) {
        const target = WEEKDAYS[name];
        let delta = (target - baseDate.getDay() + 7) % 7;
        if (delta === 0) delta = 7; // "الاثنين" يعني القادم لا اليوم
        return { date: S().addDaysISO(base, delta), source: 'يوم أسبوع' };
      }
    }

    return { date: null, source: null };
  }

  function parsePeriod(text) {
    const n = normalize(text);

    // ١) «الساعة X» صريحة — لها الأولوية على فترات اليوم العامة
    //    (لأن «الساعة عشر الصباح» تعني 10:00 لا 08:00)
    const HOUR_WORDS = {
      'واحده':1, 'واحدة':1, 'واحد':1, 'الثانيه':2, 'الثانية':2, 'الثاني':2, 'اثنتين':2, 'اثنين':2,
      'ثلاثه':3, 'ثلاثة':3, 'ثلاث':3, 'اربعه':4, 'أربعة':4, 'اربعة':4, 'اربع':4, 'أربع':4,
      'خمسه':5, 'خمسة':5, 'خمس':5, 'سته':6, 'ستة':6, 'ست':6,
      'سبعه':7, 'سبعة':7, 'سبع':7, 'ثمانيه':8, 'ثمانية':8, 'ثماني':8, 'ثمان':8,
      'تسعه':9, 'تسعة':9, 'تسع':9, 'عشره':10, 'عشرة':10, 'عشر':10,
      'احدعشر':11, 'احد عشر':11, 'اثناعشر':12, 'اثنا عشر':12, 'اثني عشر':12
    };

    // رقمي: «الساعة 10:30» أو «الساعة 3 مساء»
    let mNumeric = n.match(/(?:الساعه|الساعة)\s*(\d{1,2})(?::(\d{2}))?\s*(صباحا|صباحًا|صباح|مساء|مساءً|ظهرا|ظهرًا|ظهر|عصرا|عصرًا|عصر|ليلا|ليلًا|ليل)?/);
    if (mNumeric) {
      let h = +mNumeric[1];
      const mi = mNumeric[2] ? +mNumeric[2] : 0;
      const ap = mNumeric[3] || '';
      if (/مساء|عصر|ليل/.test(ap) && h < 12) h += 12;
      if (/ظهر/.test(ap) && h < 12 && h !== 12) { /* الظهر يبقى كما هو إن كان 12 */ if (h < 9) h += 12; }
      if (h >= 0 && h <= 23 && mi <= 59) return String(h).padStart(2,'0') + ':' + String(mi).padStart(2,'0');
    }

    // كلمات: «الساعة عشر»، «الساعة سبع»
    const mHour = n.match(/(?:الساعه|الساعة)\s+([\u0621-\u064A]+)/u);
    if (mHour) {
      const w = mHour[1];
      let h = HOUR_WORDS[w] || HOUR_WORDS[stripArticle(w)] || HOUR_WORDS[stripSuffix(w)];
      if (h) {
        const isPM = /(?:مساء|عصر|ليل|بعد\s+الظهر|بعد\s+العصر|بعد\s+المغرب|بالليل|ليلا|الليل)/.test(n);
        if (isPM && h < 12) h += 12;
        return String(h).padStart(2,'0') + ':00';
      }
    }

    // ٢) فترات اليوم العامة (الترتيب مهم: الأطول أولًا)
    for (const p of PERIODS) {
      if (n.indexOf(normalize(p.w)) > -1) return p.v;
    }

    // ٣) وقت بصيغة HH:MM مجردة
    const m = n.match(/(?:^|\s)(\d{1,2}):(\d{2})(?=\s|$)/);
    if (m) {
      const h = +m[1], mi = +m[2];
      if (h <= 23 && mi <= 59) return String(h).padStart(2,'0') + ':' + String(mi).padStart(2,'0');
    }
    return null;
  }

  /* ── استخراج اسم العميل/المندوب/الصنف ────────────────────── */
  // كلمات توقف: لا تُعتبر جزءًا من الاسم
  const STOP_WORDS = ['عن','من','في','على','بشان','بشأن','بخصوص','لان','لأن','حتى','مع','و','الى','إلى',
    'خلال','قبل','بعد','عشان','شان','عند','لدى','هذا','هذه','ذلك','الذي','التي','ضد','حول','بس','بسعر',
    'مبلغ','مقدار','قيمة','الاجل','الدفعة','الدفعه','كامل','كاملة','ريال','دولار',
    // تعبيرات الوقت — ليست أسماء
    'اليوم','هاليوم','بكرة','بكره','بكرا','غدا','غدًا','الغد','باكر','لحق','امس','أمس','البارحة','امبارح',
    'الصباح','الظهر','العصر','المغرب','الليل','العشاء','الفجر','بالصباح','بالليل',
    'الاحد','الاثنين','الثلاثاء','الاربعاء','الأربعاء','الخميس','الجمعة','السبت',
    'كل','يوميًا','يوميا','اسبوعيًا','شهريًا','عاجل','عاجلًا','ضروري','لاحقًا','مستعجل','فورًا'];

  // يقتطع الجملة عند أول كلمة توقف أو رقم أو علامة ترقيم
  function trimEntityName(s) {
    if (!s) return '';
    let v = String(s).trim();
    // قطع عند الأرقام
    v = v.replace(/\d.*$/, '').trim();
    // قطع عند أول كلمة توقف
    const parts = v.split(/\s+/);
    const kept = [];
    for (const p of parts) {
      const np = normalize(p);
      if (STOP_WORDS.indexOf(np) > -1) break;
      if (np.length < 2) break;
      kept.push(p);
      if (kept.length >= 2) break;   // اسم أو اسمان كحد أقصى
    }
    v = kept.join(' ').trim();
    // قطع عند علامات الترقيم
    v = v.replace(/[،,.!؟;:\-]+.*$/, '').trim();
    return v.length > 1 && v.length < 40 ? v : '';
  }

  function parseEntities(text) {
    const out = { client: '', rep: '', branch: '', item: '' };
    const patterns = [
      ['client', /(?:العميل|عميل|العميله|العميلة|الحاج|الشيخ|الأخ|الاخ)\s+([^\n،,.!؟;:]{2,40})/u],
      ['rep',    /(?:المندوب|مندوب|الموزع|موزع)\s+([^\n،,.!؟;:]{2,40})/u],
      ['branch', /(?:فرع|الفرع|محل|المحل|محلات)\s+([^\n،,.!؟;:]{2,40})/u],
      ['item',   /(?:صنف|الصنف|منتج|المنتج)\s+([^\n،,.!؟;:]{2,40})/u]
    ];
    patterns.forEach(([key, re]) => {
      const m = text.match(re);
      if (m && m[1]) {
        const v = trimEntityName(m[1]);
        if (v) out[key] = v;
      }
    });
    return out;
  }

  function parseAmount(text) {
    const n = normalize(text);
    // أرقام عربية-هندية
    const digitMap = { '٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9' };
    const ar = n.replace(/[٠-٩]/g, d => digitMap[d]);

    // 1) صيغة «N ألف» أولًا (قبل الرقم المجرد) لتفادي قراءة 5 بدل 5000
    let m = ar.match(/(\d[\d,\.]*)\s*(?:الف|ألف)/);
    if (m) {
      const num = parseFloat(m[1].replace(/,/g, ''));
      if (!isNaN(num) && num > 0) return { amount: num * 1000, raw: m[0].trim() };
    }

    // 2) أرقام مكتوبة بالكلمات: «خمسة آلاف»، «عشرة آلاف»، «مئة ألف»
    //    نعمل على النص المُطبَّع حتى تتوحد الصيغ (مائة/ماءه/مئه)
    //    ونرتب من الأطول إلى الأقصر حتى لا يُقرأ جزء من العبارة
    const WORD_NUMS = [
      { w: 'مليون', v: 1000000 },
      { w: 'مايه الف', v: 100000 }, { w: 'ماءه الف', v: 100000 }, { w: 'مئه الف', v: 100000 },
      { w: 'ميه الف', v: 100000 }, { w: 'مايه الف', v: 100000 },
      { w: 'خمسين الف', v: 50000 }, { w: 'اربعين الف', v: 40000 }, { w: 'ثلاثين الف', v: 30000 },
      { w: 'عشرين الف', v: 20000 }, { w: 'عشره الاف', v: 10000 }, { w: 'عشر الاف', v: 10000 },
      { w: 'خمسه الاف', v: 5000 }, { w: 'خمس الاف', v: 5000 },
      { w: 'اربعه الاف', v: 4000 }, { w: 'اربعه الاف', v: 4000 }, { w: 'اربع الاف', v: 4000 },
      { w: 'ثلاثه الاف', v: 3000 }, { w: 'ثلاث الاف', v: 3000 },
      { w: 'الفين', v: 2000 }, { w: 'الفان', v: 2000 }, { w: 'الفى', v: 2000 },
      { w: 'مايه', v: 100 }, { w: 'ماءه', v: 100 }, { w: 'مئه', v: 100 }, { w: 'ميه', v: 100 },
      { w: 'الف', v: 1000 }
    ];
    for (const wn of WORD_NUMS) {
      if (ar.indexOf(wn.w) > -1) return { amount: wn.v, raw: wn.w };
    }

    // 3) رقم مجرد مع أو بدون عملة
    m = ar.match(/(\d[\d,\.]*)\s*(?:ريال|ر\.ي|ر س|دولار|ريالا)?/);
    if (m && m[1]) {
      const num = parseFloat(m[1].replace(/,/g, ''));
      if (!isNaN(num) && num > 0) return { amount: num, raw: m[0].trim() };
    }

    return { amount: null, raw: null };
  }

  /* ── التصنيف الرئيسي ─────────────────────────────────────── */
  function classify(text) {
    let best = null, bestScore = 0, bestSec = null, bestMatched = [];

    // ── إشارات قوية تُحسم مباشرة ──
    // وجود مبلغ أو فعل تحصيل أو اسم عميل ⇒ قسم العمل / تحصيل المستحقات
    const n = normalize(text);
    const hasAmount = parseAmount(text).amount !== null;
    const collectVerb = /(?:تحصيل|احصل|أحصل|نحصل|أسدد|اسدد|سدد|يسدد|اقبض|أقبض|مستحق|متاخر|ديون|مديون)/.test(n);
    const hasClient = /(?:العميل|عميل|الحاج|الشيخ)/.test(n);
    const workSignal = /(?:حساب|مخزن|بضاعه|مبيعات|مندوب|موزع|اسعار|سعر|موظف|فاتوره|جرد|طلبي|توريد|فرع|محل)/.test(n);

    if ((hasAmount && (collectVerb || hasClient)) || (collectVerb && hasClient)) {
      return { sectionId: 'sec_work', categoryId: 'cat_collect',
               confidence: 1, matched: ['إشارة تحصيل مؤكدة'] };
    }

    // التقارير والإجتماعات لها أولوية على المبيعات عند ذكر «تقرير»
    if (/(?:^|\s)(?:تقرير|تقارير|ملخص)(?=\s|$)/.test(n)) {
      if (workSignal || /مبيعات|بيع/.test(n)) {
        return { sectionId: 'sec_work', categoryId: 'cat_reports',
                 confidence: 0.9, matched: ['تقرير'] };
      }
    }

    // عطل/خطأ صريح في تطبيق ⇒ إصلاح الأخطاء لا «تطبيقات أندرويد»
    const bugSignal = /(?:مشكله|خطا|اخطاء|بق|عطل|انهيار|كراش|crash|bug|error|فشل|توقف|لا\s+يعمل|ما\s+يعمل)/.test(n);
    const androidSignal = /(?:android|اندرويد|apk|كوتلن|kotlin)/.test(n);
    if (bugSignal) {
      if (androidSignal) return { sectionId: 'sec_tech', categoryId: 'cat_bug', confidence: 0.95, matched: ['خطأ في تطبيق'] };
      if (/(?:تنزيل|تحميل)/.test(n)) return { sectionId: 'sec_tech', categoryId: 'cat_bug', confidence: 0.9, matched: ['مشكلة تنزيل'] };
    }

    CAT_RULES.forEach(rule => {
      let score = 0;
      const matched = [];
      rule.w.forEach(w => {
        if (hasAny(text, [w])) {
          // العبارات المركّبة (بمسافة) أدق من الكلمة المفردة → وزن أعلى
          const weight = w.indexOf(' ') > -1 ? 4 : (w.length >= 6 ? 1.5 : 1);
          score += weight;
          matched.push(w);
        }
      });
      // تعزيز: إشارات العمل ترفع تصنيفات قسم العمل
      if (score > 0 && rule.sec === 'sec_work' && workSignal) score += 0.5;
      if (score > bestScore) {
        bestScore = score; best = rule.cat; bestSec = rule.sec; bestMatched = matched;
      }
    });

    if (!best) return { sectionId: 'sec_personal', categoryId: 'cat_duties', confidence: 0, matched: [] };
    return {
      sectionId: bestSec,
      categoryId: best,
      confidence: Math.min(1, bestScore / 5),
      matched: bestMatched
    };
  }

  /* ── بناء مهمة من مقطع نصي ───────────────────────────────── */
  function taskFromSegment(seg, opts) {
    opts = opts || {};
    const cls = classify(seg);
    const dt = parseDate(seg, opts.nowISO);
    const period = parsePeriod(seg);

    let priority = 'normal';
    for (const rule of PRIORITY_RULES) {
      if (hasAny(seg, rule.w)) { priority = rule.p; break; }
    }

    let repeat = 'none';
    const nSeg = normalize(seg);
    for (const rp of REPEAT_PATTERNS) {
      if (rp.re.test(nSeg)) { repeat = rp.r; break; }
    }

    let kind = 'task';
    for (const k in KIND_RULES) {
      if (hasAny(seg, KIND_RULES[k])) { kind = k; break; }
    }

    let size = 'small';
    if (hasAny(seg, SIZE_RULES.large)) size = 'large';
    else if (hasAny(seg, SIZE_RULES.smallKw)) size = 'small';

    const ent = parseEntities(seg);
    const amt = parseAmount(seg);

    // عنوان نظيف ومختصر
    let title = seg
      .replace(/^(?:ان|أن|إني|اني)\s+/u, '')
      .trim();

    // ١) إزالة تعبيرات الوقت أولًا (التاريخ والوقت لهما حقولهما الخاصة)
    //    نعمل على نسخة منقّصة، لكن نتحقق أن العنوان لن يصبح فارغًا
    const timeExpressions = [
      'بعد المغرب','بعد العصر','بعد العشاء','بعد الظهر','قبل الظهر','بعد الفجر',
      'الصباح','بالصباح','الظهر','العصر','المغرب','الليل','بالليل','العشاء','الفجر',
      'بعد بكرة','بعد بكره','بعد غد','بعد غدا','بكرة','بكره','بكرا','غدا','غدًا','الغد','باكر',
      'اليوم','هاليوم','أمس','امس','البارحة','امبارح',
      'نهاية الشهر','آخر الشهر','اخر الشهر','بداية الشهر','أول الشهر','اول الشهر',
      'نهاية الأسبوع','نهاية الاسبوع','الويكند','الأسبوع القادم','الاسبوع القادم',
      'الشهر القادم','بعد أسبوع','بعد اسبوع','بعد شهر',
      // أسماء أيام الأسبوع — تُنقل لحقل التاريخ
      'يوم الأحد','يوم الاثنين','يوم الثلاثاء','يوم الأربعاء','يوم الخميس','يوم الجمعة','يوم السبت',
      'الأحد','الاحد','الاثنين','الإثنين','الأثنين','الاتنين','الثلاثاء','الثلاثا',
      'الأربعاء','الاربعاء','الأربعا','الخميس','الجمعة','الجمعه','السبت',
      // التكرار
      'كل يوم','كل أسبوع','كل اسبوع','كل شهر','يوميًا','يوميا','أسبوعيًا','اسبوعيا','شهريًا','شهريا',
      // الأولوية
      'عاجل','عاجلًا','عاجلا','بسرعة','فورًا','فورا','مستعجل','لاحقًا','لاحقا','ضروري',
      'مهم جدًا','مهم جدا','ما يتأخر'
    ];
    let stripped = title;
    timeExpressions.forEach(exp => {
      const re = new RegExp('(^|[\\s،])' + exp.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?=\\s|،|$)', 'u');
      stripped = stripped.replace(re, '$1');
    });
    // إزالة «الساعة <كلمة>» كاملة (بعد أن نُقل الوقت لحقله)
    stripped = stripped.replace(/(?:^|\s)الساع[هة]\s+[\u0621-\u064A]+/u, ' ');
    stripped = stripped.replace(/\s{2,}/g, ' ').replace(/^[\s،,]+|[\s،,]+$/g, '').trim();
    if (stripped.length >= 4) title = stripped;   // نتبنّى النسخة المنقّصة فقط إن بقيت ذات معنى

    // ٢) تحويل الأفعال المضارعة في البداية إلى صيغة اسمية أوضح
    const VERB_MAP = [
      [/^(?:أراجع|اراجع|راجع|راجعت|نراجع)\s+/u, 'مراجعة '],
      [/^(?:أتابع|اتابع|تابع|تابعت|نتبع)\s+/u, 'متابعة '],
      [/^(?:أجهز|اجهز|جهز|جهزت|أحضر|احضر|نحضر)\s+لي\s+/u, 'تجهيز '],
      [/^(?:أجهز|اجهز|جهز|جهزت|أحضر|احضر|نحضر)\s+/u, 'تجهيز '],
      [/^(?:اتصل|أكلم|اكلم|كلم|اتكلم)\s+/u, 'الاتصال بـ '],
      [/^(?:أرسل|ارسل|رسل)\s+/u, 'إرسال '],
      [/^(?:أدفع|ادفع|دفع|أسدد|اسدد|سدد|يسدد|نحصل|أحصل|احصل|تحصل)\s+/u, 'تحصيل '],
      [/^(?:أرتب|ارتب|رتب)\s+/u, 'ترتيب '],
      [/^(?:أشوف|اشوف|شوف)\s+/u, 'مراجعة '],
      [/^(?:أزور|ازور|زر)\s+/u, 'زيارة '],
      [/^(?:أشتري|اشتري|اشتر)\s+/u, 'شراء '],
      [/^(?:أصلح|اصلح|صلح)\s+/u, 'إصلاح '],
      [/^(?:نراجع|نرتب|ننشر|نبني|نطور|نسجل|نسوّي|نسوي)\s+/u, 'تجهيز '],
      [/^(?:أعمل|اعمل)\s+/u, 'إعداد '],
      [/^(?:لازم|يجب|ضروري)\s+(?:لازم\s+)?/u, '']
    ];
    for (const [re, rep] of VERB_MAP) {
      if (re.test(title)) { title = title.replace(re, rep); break; }
    }

    // إزالة حشو الكلام اليمني/العامي من بداية العنوان
    title = title
      .replace(/^(?:عندنا|عندي|احنا|إحنا|نحن|لازم\s+لازم)\s+/u, '')
      .replace(/^(?:بس|كذا|هيك|زين)\s+/u, '')
      .trim();

    title = title.replace(/\s{2,}/g, ' ').replace(/^[\s،,]+|[\s،,]+$/g, '').trim();

    if (title.length < 2) title = seg.slice(0, 90);
    if (title.length > 90) title = title.slice(0, 87) + '…';

    // المهام المتكررة بلا تاريخ صريح: أول موعد هو اليوم (أو الغد إن ذُكر وقت مضى)
    // «كل يوم أراجع الحسابات» → تبدأ اليوم، وتتكرر يوميًا بعد ذلك
    let dueDate = dt.date;
    if (repeat !== 'none' && !dueDate) dueDate = S().todayISO();

    const t = S().newTask({
      title: title,
      sectionId: cls.sectionId,
      categoryId: cls.categoryId,
      priority: priority,
      size: size,
      kind: kind,
      dueDate: dueDate,
      repeat: repeat,
      notes: period ? 'الوقت المقترح: ' + period : '',
      client: ent.client, rep: ent.rep, branch: ent.branch, item: ent.item,
      amount: amt.amount,
      _meta: { confidence: cls.confidence, matched: cls.matched, dateSource: dt.source, period: period }
    });
    return t;
  }

  /* ── الواجهة العامة للمحلّل المحلي ────────────────────────── */
  function parseLocal(rawText, opts) {
    const segments = mergeFragments(splitUtterances(rawText));
    if (!segments.length) return { tasks: [], engine: 'local', segments: 0 };
    const tasks = segments.map(seg => taskFromSegment(seg, opts));
    return { tasks, engine: 'local', segments: segments.length };
  }

  /* ═══════════════════════════════════════════════════════════
     طبقة الذكاء الاصطناعي الاختيارية
     لا مفتاح API في الواجهة — العنوان فقط، والمفتاح يبقى على
     الخادم أو يُدار من الإعدادات كمتغير بيئة.
     ═══════════════════════════════════════════════════════════ */
  function buildPrompt(text, sections, categories, today) {
    const secList = sections.map(s =>
      '- ' + s.id + ' :: ' + s.name + ' :: تصنيفاته: ' +
      categories.filter(c => c.sectionId === s.id).map(c => c.id + '=' + c.name).join(', ')
    ).join('\n');

    return [
      'أنت مساعد تنظيم مهام عربي. حوّل النص التالي إلى مهام منفصلة بصيغة JSON فقط.',
      'لا تختلق أي اسم أو رقم أو تاريخ غير موجود في النص. اترك الحقل null إن لم يتوفر.',
      'اليوم الحالي: ' + today + ' (توقيت المستخدم).',
      '',
      'الأقسام المتاحة:',
      secList,
      '',
      'أعد كائنًا بهذا الشكل بالضبط:',
      '{"tasks":[{"title":"عنوان مختصر","sectionId":"معرف القسم","categoryId":"معرف التصنيف أو null",',
      '"dueDate":"YYYY-MM-DD أو null","priority":"low|normal|high|urgent","size":"small|large",',
      '"kind":"task|meeting|reminder|ai_assist","repeat":"none|daily|weekly|monthly",',
      '"client":"","rep":"","branch":"","item":"","amount":null,"quantity":null,"notes":""}]}',
      '',
      'النص:',
      '"""' + text + '"""'
    ].join('\n');
  }

  async function parseRemote(rawText, opts) {
    const st = S().state;
    const endpoint = (st.settings.aiEndpoint || '').trim();
    if (!endpoint) return { error: 'no_endpoint' };

    const today = S().todayISO();
    const prompt = buildPrompt(rawText, st.sections, st.categories, today);

    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 20000);

    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: st.settings.aiModel || undefined,
          messages: [
            { role: 'system', content: 'أنت محلل مهام عربي. تُخرج JSON صالحًا فقط.' },
            { role: 'user', content: prompt }
          ],
          temperature: 0.2
        }),
        signal: ctrl.signal
      });
      clearTimeout(timer);

      if (!res.ok) return { error: 'http_' + res.status };
      const data = await res.json();
      const content = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content)
                    || data.content || data.text || '';
      if (!content) return { error: 'empty_response' };

      const jsonMatch = content.match(/\{[\s\S]*\}/);
      if (!jsonMatch) return { error: 'bad_json' };
      const parsed = JSON.parse(jsonMatch[0]);
      if (!parsed.tasks || !Array.isArray(parsed.tasks)) return { error: 'bad_shape' };

      const tasks = parsed.tasks.map(p => {
        const sec = st.sections.find(s => s.id === p.sectionId) ? p.sectionId :
                    (st.sections.find(s => s.short === p.sectionId) ? st.sections.find(s => s.short === p.sectionId).id : 'sec_personal');
        const catOk = st.categories.some(c => c.id === p.categoryId && c.sectionId === sec);
        return S().newTask({
          title: (p.title || '').slice(0, 120) || 'مهمة',
          sectionId: sec,
          categoryId: catOk ? p.categoryId : null,
          dueDate: /^\d{4}-\d{2}-\d{2}$/.test(p.dueDate || '') ? p.dueDate : null,
          priority: ['low','normal','high','urgent'].includes(p.priority) ? p.priority : 'normal',
          size: p.size === 'large' ? 'large' : 'small',
          kind: ['task','meeting','reminder','ai_assist'].includes(p.kind) ? p.kind : 'task',
          repeat: ['none','daily','weekly','monthly'].includes(p.repeat) ? p.repeat : 'none',
          client: p.client || '', rep: p.rep || '', branch: p.branch || '', item: p.item || '',
          amount: (typeof p.amount === 'number' && isFinite(p.amount)) ? p.amount : null,
          quantity: (typeof p.quantity === 'number' && isFinite(p.quantity)) ? p.quantity : null,
          notes: p.notes || '',
          _meta: { confidence: 0.9, source: 'ai' }
        });
      });
      return { tasks, engine: 'ai', segments: tasks.length };
    } catch (e) {
      clearTimeout(timer);
      return { error: e.name === 'AbortError' ? 'timeout' : 'network' };
    }
  }

  // الواجهة الموحّدة: تجرب AI إن وُجد، وإلا المحلي، وتبقى تعمل دائمًا
  async function parse(rawText, opts) {
    opts = opts || {};
    const st = S().state;
    const useAI = opts.force !== 'local' && !!st.settings.aiEndpoint;

    if (useAI) {
      const r = await parseRemote(rawText, opts);
      if (r && r.tasks && r.tasks.length) return r;
      // الفشل لا يعطّل التطبيق — نعود للمحلي
      const local = parseLocal(rawText, opts);
      local.fellBack = true;
      local.reason = r && r.error;
      return local;
    }
    return parseLocal(rawText, opts);
  }

  global.DH = global.DH || {};
  global.DH.ai = {
    parse, parseLocal, parseRemote,
    splitUtterances, classify, parseDate, parsePeriod,
    parseEntities, parseAmount, normalize,
    CAT_RULES
  };
})(window);

  /* ── التوليد ─────────────────────────────────────────────── */
  function generate(type, ctx) {
    const builder = BUILDERS[type];
    if (!builder) return { error: 'نوع المسودة غير معروف' };

    const enriched = Object.assign({
      today: S().todayISO(),
      dateLabel: ctx.dateLabel || S().todayISO()
    }, ctx);

    let draft;
    try {
      draft = builder(enriched);
    } catch (e) {
      return { error: 'تعذّر توليد المسودة: ' + e.message };
    }

    const missing = collectNeeds(type, enriched);

    // القاعدة الإلزامية: سطر النواقص
    if (missing.length) {
      draft += '\n\n' + '─'.repeat(30) + '\nأحتاج منك:\n' +
               missing.map((m, i) => (i + 1) + '. ' + m).join('\n');
    } else {
      draft += '\n\n' + '─'.repeat(30) + '\nأحتاج منك: لا شيء — كل البيانات الأساسية متوفرة. راجع المسودة قبل الإرسال.';
    }

    const meta = ASSIST_TYPES.find(t => t.id === type);
    return { draft, missing, type, label: meta ? meta.label : type, createdAt: new Date().toISOString() };
  }

  /* ── اكتشاف المهام القابلة للمساعدة ──────────────────────── */
  // يقترح نوع المساعدة بناءً على عنوان المهمة وتصنيفها.
  // ملاحظة مهمة: الأنماط مكتوبة على النص المُطبَّع (بلا همزات/تشكيل/ة)
  // لأن detectAssist يطبّع النص قبل المطابقة.
  const DETECT_RULES = [
    { type: 'bug_prompt',     re: /(برومبت|اصلاح مشكله|اصلاح خلل|وصف مشكله|bug report|تقرير خطا|شكوى خطا)/ },
    { type: 'fix_plan',       re: /(خطه اصلاح|معالجه خطا|حل مشكله برمجيه|خطه معالجه)/ },
    { type: 'release_note',   re: /(ملاحظات اصدار|release note|تحديث الاصدار|ملاحظات الاصدار)/ },
    { type: 'circular_reps',  re: /(تعميم|المندوبين|الموزعين|خط سير|تعليمات للمندوب)/ },
    { type: 'letter_staff',   re: /(خطاب|تعميم للموظف|انذار|تعليمات للموظف|مكافاه)/ },
    { type: 'collection_msg', re: /(تحصيل|مستحق|ديون|متاخرات|رساله للعميل|مطالبه)/ },
    { type: 'sales_report',   re: /(تقرير مبيعات|ملخص مبيعات|تقرير بيع|احصائيه مبيعات)/ },
    { type: 'agenda',         re: /(اجنده|تحضير اجتماع|جدول اعمال|تجهيز اجتماع)/ },
    { type: 'email',          re: /(بريد|ايميل|email|مراسله)/ },
    { type: 'followup_list',  re: /(قائمه متابعه|متابعه شامله|خطه متابعه)/ },
    { type: 'plan',           re: /(خطه عمل|خطه تنفيذيه|استراتيجيه|هدف سنوي)/ },
    { type: 'daily_plan',     re: /(خطه يوم|تنظيم اليوم|ترتيب يومي)/ }
  ];

  function detectAssist(task) {
    if (!task) return null;
    const raw = (task.title || '') + ' ' + (task.notes || '');
    const text = DH.ai.normalize(raw);   // تطبيع: همزات، ة→ه، تشكيل

    for (const r of DETECT_RULES) {
      if (r.re.test(text)) {
        const t = ASSIST_TYPES.find(x => x.id === r.type);
        if (!t) continue;
        // إن لم يكن النوع متاحًا لهذا القسم، جرّب النوع التالي المناسب
        if (t.sections.includes(task.sectionId)) return t;
        // داخل القسم التقني: أي مهمة تقنية معقّدة تستفيد من خطة إصلاح
        if (task.sectionId === 'sec_tech' && t.id === 'bug_prompt') {
          return ASSIST_TYPES.find(x => x.id === 'fix_plan');
        }
      }
    }
    // اجتماع في قسم العمل → أجندة
    if (task.kind === 'meeting' && task.sectionId === 'sec_work') {
      return ASSIST_TYPES.find(x => x.id === 'agenda');
    }
    return null;
  }

  // كل المهام المفتوحة التي لها مساعدة مقترحة
  function assistableTasks(tasks) {
    return tasks
      .filter(t => t.status !== 'done' && !t.canceled && t.kind !== 'meeting')
      .map(t => ({ task: t, assist: detectAssist(t) }))
      .filter(x => !!x.assist);
  }

  /* ── نسخ إلى الحافظة ─────────────────────────────────────── */
  async function copyToClipboard(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (e) { /* fallback */ }
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }

  global.DH = global.DH || {};
  global.DH.assist = {
    ASSIST_TYPES, typesFor, generate, collectNeeds,
    detectAssist, assistableTasks, copyToClipboard
  };
})(window);
