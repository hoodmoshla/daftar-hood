<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>دفتر هود الذكي</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="دفتر هود الذكي — إدارة المهام والمشاريع والحياة اليومية بالعربية">
<meta name="theme-color" content="#F4F6F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="دفتر هود">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232E7D6B'/><text y='72' x='50' font-size='58' text-anchor='middle' fill='white'>📔</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app" role="application" aria-label="دفتر هود الذكي">
  <div class="boot-splash" style="padding:60px 20px;text-align:center;color:#8A94A3">
    <div style="font-size:38px;margin-bottom:10px">📔</div>
    <div style="font-weight:700">جارٍ تحميل دفتر هود…</div>
  </div>
</div>

<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<noscript>
  <div style="padding:30px;text-align:center;font-family:Tahoma">
    <h2>يحتاج دفتر هود إلى JavaScript</h2>
    <p>يرجى تشغيل JavaScript في المتصفح لتشغيل التطبيق.</p>
  </div>
</noscript>

<script src="js/store.js"></script>
<script src="js/ai.js"></script>
<script src="js/assist.js"></script>
<script src="js/calendar.js"></script>
<script src="js/ui.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  try {
    DH.ui.boot();
  } catch (e) {
    console.error('خطأ في الإقلاع:', e);
    document.getElementById('app').innerHTML =
      '<div style="padding:36px 20px;text-align:center;font-family:Tahoma">' +
      '<div style="font-size:34px;margin-bottom:10px">⚠️</div>' +
      '<h2 style="font-size:18px">تعذّر تشغيل التطبيق</h2>' +
      '<p style="color:#8A94A3;font-size:14px">' + (e && e.message ? e.message : 'خطأ غير معروف') + '</p>' +
      '<p style="color:#8A94A3;font-size:13px">بياناتك المحفوظة لم تُمس. أعد تحميل الصفحة للمحاولة مرة أخرى.</p>' +
      '</div>';
  }
});

// نموذج PWA بسيط — التخزين في الكاش يعمل عند توفّر service worker
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (e) {
      console.info('service worker غير مُسجّل:', e.message);
    });
  });
}
</script>
</body>
</html>
